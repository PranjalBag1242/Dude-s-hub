<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #1a1a1a;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        .info {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
            font-size: 1.2em;
        }

        .info div {
            display: flex;
            flex-direction: column;
        }

        .info label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .info span {
            font-weight: bold;
            font-size: 1.3em;
        }

        .controls {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
        }

        .controls p {
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex: 1;
            min-width: 100px;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Mobile Arrow Controls */
        .mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .mobile-controls.active {
            display: flex;
        }

        .arrow-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn {
            background-color: #667eea;
            color: white;
            border: 3px solid white;
            padding: 15px;
            font-size: 2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .arrow-btn:active {
            background-color: #764ba2;
            transform: scale(0.95);
        }

        .arrow-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .arrow-spacer {
            width: 70px;
        }

        .mobile-label {
            color: white;
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #667eea;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
            min-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 15px;
            font-size: 2em;
        }

        .modal-content p {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .modal-content button {
            background-color: #4CAF50;
            width: auto;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .info {
                font-size: 1em;
            }

            button {
                padding: 10px 20px;
                font-size: 0.95em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .arrow-btn {
                width: 80px;
                height: 80px;
                font-size: 2.2em;
            }

            .arrow-spacer {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        
        <div class="info">
            <div>
                <label>Score</label>
                <span id="score">0</span>
            </div>
            <div>
                <label>High Score</label>
                <span id="highScore">0</span>
            </div>
            <div>
                <label>Speed</label>
                <span id="speed">Normal</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Mobile Arrow Controls -->
        <div class="mobile-controls" id="mobileControls">
            <div class="mobile-label">Use arrow buttons to move</div>
            
            <div class="arrow-row">
                <div class="arrow-spacer"></div>
                <button class="arrow-btn" data-direction="up">▲</button>
                <div class="arrow-spacer"></div>
            </div>

            <div class="arrow-row">
                <button class="arrow-btn" data-direction="left">◄</button>
                <button class="arrow-btn" data-direction="down">▼</button>
                <button class="arrow-btn" data-direction="right">►</button>
            </div>
        </div>

        <div class="controls">
            <p id="controlsInfo">Use Arrow Keys or WASD to move the snake</p>
            <div class="button-group">
                <button onclick="togglePause()">Pause/Resume</button>
                <button onclick="changeSpeed()">Change Speed</button>
                <button onclick="resetGame()">New Game</button>
            </div>
        </div>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="finalHighScore">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mobileControls = document.getElementById('mobileControls');
        const controlsInfo = document.getElementById('controlsInfo');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 }
        ];

        let food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };

        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;
        let gamePaused = false;
        let gameSpeed = 100; // milliseconds

        document.getElementById('highScore').textContent = highScore;

        // Detect if mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile) {
            mobileControls.classList.add('active');
            controlsInfo.textContent = 'Use the arrow buttons below to move the snake';
        }

        // Keyboard controls for desktop
        document.addEventListener('keydown', (e) => {
            if (gamePaused && e.key !== ' ') return;

            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // Mobile touch controls
        document.querySelectorAll('.arrow-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleMobileDirection(btn.dataset.direction);
            });

            btn.addEventListener('click', (e) => {
                e.preventDefault();
                handleMobileDirection(btn.dataset.direction);
            });
        });

        function handleMobileDirection(dir) {
            if (gamePaused) return;

            switch(dir) {
                case 'up':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        function update() {
            if (!gameRunning || gamePaused) return;

            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            let newFood;
            let foodOnSnake = true;

            while (foodOnSnake) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                foodOnSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }

            food = newFood;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#4CAF50';
                } else {
                    ctx.fillStyle = '#45a049';
                }
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });

            // Draw food
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            document.querySelectorAll('.button-group button')[0].textContent = gamePaused ? 'Resume' : 'Pause/Resume';
        }

        function changeSpeed() {
            const speeds = [150, 100, 70, 50];
            const speedNames = ['Slow', 'Normal', 'Fast', 'Insane'];
            
            const currentIndex = speeds.indexOf(gameSpeed);
            const nextIndex = (currentIndex + 1) % speeds.length;
            
            gameSpeed = speeds[nextIndex];
            document.getElementById('speed').textContent = speedNames[nextIndex];
        }

        function endGame() {
            gameRunning = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalHighScore').textContent = highScore;
            document.getElementById('gameOverModal').classList.add('show');
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameRunning = true;
            gamePaused = false;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOverModal').classList.remove('show');
            document.querySelectorAll('.button-group button')[0].textContent = 'Pause/Resume';
            generateFood();
            gameLoop();
        }

        function gameLoop() {
            update();
            draw();

            if (gameRunning) {
                setTimeout(gameLoop, gameSpeed);
            }
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
