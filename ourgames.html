<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dude's games</title>
    <style>
        body{
            background-color: lightskyblue;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body h1{
            background: linear-gradient(90deg, aqua, rgba(0, 0, 0, 0));
            padding: 5px;
            border-radius: 5px;
            font-size: 40px;
        }
        .gamecont{
            background-color: rgba(255, 255, 255, 0.3);
            font: menu;
            font-size: 30px;
            border-radius: 20px;
            padding: 10px;
        }
        .backbutt button{
            background-color: lightgreen;
            border: none;
            padding: 10px;
            font-size: 26px;
            border-radius: 20px;
            box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.5);
        }
        .backbutt button:hover{
            background-color: rgb(114, 189, 114);
            border: none;
            padding: 10px;
            font-size: 26px;
            border-radius: 20px;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <h1>Here are our games:</h1>
    <div class="gamecont">
        <ol>
            <li><a href="https://www.itch.io/">Periodic Table</a></li>
        </ol>
    </div><br>
    <div class="backbutt">
        <button onclick="quiteorlose()">Back to hub</button>
    </div>
    <script>
        function quiteorlose() {
            close();
        }
    </script>
</body>
</html>
